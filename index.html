<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#111b20" />
<title>PIGMENT — 混ざる絵の具</title>
<style>
:root{color-scheme:dark;--bg:#111b20;--panel:#1d2b30;--metal:#324149;--rim:#43555a;--text:#edf1ed;--muted:#a8b7b5;--mint:#dbe8d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#111b20;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:2px solid #def4dc;outline-offset:3px}
.app{min-height:100dvh;background:radial-gradient(ellipse 75% 70% at 48% 43%,#27343a 0%,#19272d 63%,#111b20 100%);display:flex;align-items:flex-start;justify-content:center}
.workspace{width:100%;max-width:1560px;margin:0 auto;padding:clamp(12px,1.5vw,22px);display:grid;grid-template-columns:clamp(170px,14.3vw,214px) minmax(0,1fr) clamp(214px,18vw,260px);gap:clamp(10px,1vw,16px);align-items:stretch}
.panel{min-width:0;min-height:0;border-radius:16px;border:1px solid #7e908745;background:linear-gradient(145deg,#27363b,#1e2d33 45%,#18262c);box-shadow:0 15px 32px #030a103a,inset 0 1px 0 #ffffff16,inset 0 -2px 7px #00000020;padding:clamp(9px,1.1vw,15px);position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;inset:4px;pointer-events:none;border:1px solid #ffffff09;border-radius:12px}
.panel.left{display:flex;flex-direction:column;gap:clamp(8px,1vw,15px)}
.paints{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:clamp(4px,.55vw,9px);flex:1;min-height:0}
.paint{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:3px 1px 2px;appearance:none;border:1px solid #ffffff18;border-radius:12px;color:#d5dfdb;background:linear-gradient(145deg,#2d4045,#1b2c32);box-shadow:inset 0 1px 0 #ffffff1e,inset 0 -3px 5px #030c1244,0 1px 2px #0002;transition:background .18s,border-color .18s,transform .15s cubic-bezier(.2,.8,.3,1),box-shadow .18s;isolation:isolate}
.paint::before{content:"";position:absolute;width:75%;aspect-ratio:1;border-radius:50%;left:12.5%;top:8%;background:radial-gradient(circle at 42% 38%,#15242b,#0e1a20 75%);box-shadow:inset 1px 3px 9px #0009,inset 0 -1px 1px #ffffff1a;z-index:0}
.paint:hover{border-color:#c6d9c14a;background:linear-gradient(145deg,#34494d,#24363b)}
.paint:active{transform:scale(.94)}
.paint.active{border-color:#d8eed2a9;background:linear-gradient(145deg,#374a46,#293c3a);box-shadow:0 0 0 1px #e1f1cf33,inset 0 1px 0 #ffffff25,0 5px 13px #03090863}
.paint.active::after{content:"";position:absolute;inset:4px;border:1px solid #d6f5d516;border-radius:8px;pointer-events:none}
.pigment-well{position:relative;display:flex;width:min(90%,78px);height:clamp(33px,4.3vw,62px);align-items:center;justify-content:center;z-index:1;flex-shrink:1;min-height:0;filter:drop-shadow(0 3px 3px #050b1155)}
.pigment-art{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(1px 2px 1px #03070770)}
.pigment-lump{transform-origin:50% 58%;transition:transform .32s cubic-bezier(.2,1,.26,1)}
.paint.active .pigment-lump{transform:translateY(-2px) scale(1.06)}
.pigment-stria{fill:none;stroke:#ffffff;stroke-linecap:round;stroke-width:3;stroke-opacity:.19;filter:blur(.3px)}
.paint.refill .pigment-lump{animation:pigment-dab var(--viscosity,.38s) cubic-bezier(.21,.8,.33,1) both}
@keyframes pigment-dab{0%{transform:scale(1.05,.97)}22%{transform:scale(1.22,.73) translateY(3px)}53%{transform:scale(.95,1.08) translateY(-2px)}78%{transform:scale(1.09,.96)}100%{transform:translateY(-2px) scale(1.06)}}
.paint .name{z-index:1;position:relative;color:#d7e3e0;font-size:clamp(9px,.8vw,11px);line-height:1.12;font-weight:650;white-space:normal;text-align:center;letter-spacing:-.02em;margin-top:-2px;max-width:100%;word-break:keep-all}
.ink-well{margin-top:auto;padding:11px 11px 12px;border:1px solid #576b681c;border-radius:11px;background:linear-gradient(170deg,#122027d8,#182931a8);box-shadow:inset 0 2px 5px #0004}
.ink-head{display:flex;justify-content:space-between;align-items:center;gap:3px;margin-bottom:10px}
.ink-head strong{font-size:11px;font-weight:700}.ink-head span{font-size:10px;color:#becfc2;font-variant-numeric:tabular-nums}
.ink-bar{height:10px;border-radius:15px;background:#0a151a;overflow:hidden;border:1px solid #ffffff22;box-shadow:inset 0 1px 3px #0009}
.ink-fill{width:100%;height:100%;border-radius:12px;background:#e3d314;position:relative;transition:width .12s linear,background .15s}
.ink-fill::after{content:"";position:absolute;left:0;right:0;top:0;height:45%;border-radius:10px;background:#ffffff30}
.ink-fill.surge{animation:ink-surge .46s ease-out}
@keyframes ink-surge{20%{filter:brightness(1.65)}100%{filter:brightness(1)}}
.canvas-column{min-width:0;display:flex;align-items:flex-start;justify-content:center}
.canvas-frame{width:100%;aspect-ratio:4/3;position:relative;overflow:hidden;background:#faf9f5;border-radius:2px;box-shadow:0 0 0 1px #f2eee9a1,0 2px 3px #0005,0 21px 52px #040c1255,0 47px 90px #03080c30;isolation:isolate}
.canvas-frame::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 1px #6d776e59;pointer-events:none}
.canvas-frame canvas{width:100%;height:100%;display:block;touch-action:none;overscroll-behavior:contain;cursor:crosshair;user-select:none;-webkit-user-select:none}
.brush-outline{position:absolute;pointer-events:none;border:1.5px solid #ffffffea;box-shadow:0 0 0 1px #20373d,0 0 12px #0008;border-radius:50%;transform:translate(-50%,-50%);display:none}
.panel.right{display:flex;flex-direction:column;gap:0}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:clamp(14px,2vw,27px)}
.action{height:clamp(34px,3.2vw,46px);min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 3px;white-space:nowrap;border-radius:10px;border:1px solid #647a7842;background:linear-gradient(160deg,#384c51,#283a40 60%,#26363d);color:#dce9e3;font-size:clamp(10px,.83vw,12px);font-weight:680;box-shadow:inset 0 1px 0 #ffffff24,inset 0 -2px 1px #06101488,0 2px 3px #0005;transition:transform .13s,border-color .16s,background .16s,box-shadow .13s}
.action:hover:not(:disabled){background:linear-gradient(160deg,#445a5d,#304449)}
.action:active:not(:disabled){transform:translateY(2px) scale(.985);box-shadow:inset 0 2px 5px #0009,0 1px 1px #0003}
.action:disabled{opacity:.33;cursor:default}
.action svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .17s}
.action:active:not(:disabled) svg{transform:scale(.88)}
.action.primary{color:#1b3027;background:linear-gradient(155deg,#eaf4de,#bdcfb5);border-color:#eaf4e0;box-shadow:inset 0 1px 0 #ffffffbd,inset 0 -2px 1px #74886b66,0 3px 6px #0003}
.action.primary:hover{background:linear-gradient(#f1f8ec,#cdddc7)}
.action.saved{animation:saved-flick .6s ease-out}
@keyframes saved-flick{20%{box-shadow:0 0 0 4px #d4ebbf73,inset 0 1px 0 #fff}100%{box-shadow:inset 0 1px 0 #fff,0 3px 6px #0003}}
.mode{position:relative;display:grid;grid-template-columns:1fr 1fr;margin-bottom:clamp(15px,1.6vw,24px);padding:4px;border-radius:12px;border:1px solid #4e625e74;background:linear-gradient(160deg,#0f1c22,#1a2930);box-shadow:inset 0 2px 5px #020b11a8;isolation:isolate}
.mode::before{content:"";position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:linear-gradient(155deg,#f0f5e3,#becfb5);border-radius:9px;box-shadow:inset 0 1px 0 #fff,0 2px 9px #0008;transition:transform .23s cubic-bezier(.16,1,.3,1)}
.mode[data-active=mix]::before{transform:translateX(100%)}
.mode button{min-width:0;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:clamp(8px,.75vw,12px) 1px;border:0;background:transparent;color:#9fadaa;font-size:12px;font-weight:750;transition:color .18s,transform .13s}
.mode button.active{color:#20392e}.mode button:active{transform:scale(.94)}
.mode .tool-icon{width:18px;height:18px;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.7;transition:transform .22s cubic-bezier(.2,1.5,.3,1)}
.mode button:active .tool-icon{transform:rotate(-13deg) translateY(2px)}
.setting{margin:0 0 clamp(14px,1.6vw,23px)}
.setting-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;gap:5px}
.setting-label strong{font-size:clamp(10px,.88vw,12px);font-weight:710;color:#e7ece8;display:flex;align-items:center;gap:7px}
.setting-label output{color:#b7cfba;font-size:11px;font-variant-numeric:tabular-nums}
.brush-mark{display:inline-block;width:9px;height:9px;border-radius:50%;border:1px solid #cbe1cb;box-shadow:0 0 0 1px #4e665a;transition:width .14s,height .14s}
.drop-mark{width:10px;height:13px;background:#b4d2bc;border-radius:95% 5% 65% 45%;transform:rotate(-40deg);box-shadow:inset 2px 2px 3px #fff7}
.mix-mark{width:17px;height:14px;position:relative;display:inline-flex;align-items:center}
.mix-mark i{position:absolute;width:10px;height:10px;border-radius:50%;background:#e8c349;left:0;transition:transform .12s}
.mix-mark i+ i{background:#5686c5;left:7px;mix-blend-mode:screen;transform:translateX(calc(var(--mix-shift,0px) * -1))}
input[type=range]{width:100%;display:block;margin:0;height:6px;appearance:none;border:0;border-radius:12px;background:linear-gradient(to right,#bfd7c4 0,#bfd7c4 var(--pct,50%),#4b5f65 var(--pct,50%),#4b5f65 100%);box-shadow:inset 0 1px 2px #0008;cursor:pointer;touch-action:pan-x}
input[type=range]::-webkit-slider-thumb{appearance:none;width:20px;height:20px;border:3px solid #253e39;border-radius:50%;background:radial-gradient(circle at 34% 28%,#f3ffec,#b1cdb1 72%);box-shadow:0 0 0 2px #9bb3a876,0 2px 4px #0009;transition:box-shadow .13s,transform .13s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.14);box-shadow:0 0 0 6px #c6e0ca30,0 2px 6px #0009}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:3px solid #253e39;border-radius:50%;background:#dbead5;box-shadow:0 0 0 2px #9bb3a876,0 2px 4px #0009}
.divider{height:1px;background:linear-gradient(90deg,transparent,#869a9066,transparent);margin:clamp(1px,.65vw,10px) 0 clamp(16px,1.4vw,21px)}
.dry-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:clamp(12px,1.1vw,16px)}
.dry-head strong{font-size:12px;font-weight:750;display:flex;align-items:center;gap:8px}
.dry-head strong::before{content:"";width:15px;height:15px;display:block;opacity:.72;background:linear-gradient(140deg,#c7dfc5,#697f70);clip-path:polygon(30% 0,70% 0,70% 15%,60% 15%,60% 37%,80% 58%,80% 100%,20% 100%,20% 58%,40% 37%,40% 15%,30% 15%)}
.toggle{width:47px;height:28px;flex:0 0 47px;border:1px solid #a2bba250;background:linear-gradient(90deg,#608a6c,#86ae91);border-radius:28px;padding:3px;box-shadow:inset 0 2px 4px #0005,inset 0 0 0 1px #ffffff1a;transition:background .16s}
.toggle::before{content:"";display:block;width:20px;height:20px;background:radial-gradient(circle at 32% 26%,#fff,#d4dfd3 76%);border-radius:50%;box-shadow:0 2px 4px #0008,inset 0 1px 0 #fff;transform:translateX(19px);transition:transform .22s cubic-bezier(.18,1.4,.35,1)}
.toggle.off{background:linear-gradient(90deg,#37494d,#45585d)}.toggle.off::before{transform:translateX(0)}
.dry-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.dry-choice{min-height:36px;padding:7px 1px;min-width:0;white-space:nowrap;border-radius:8px;border:1px solid #546b6e70;color:#aebdb8;background:linear-gradient(#2e4249,#24373d);font-size:10px;box-shadow:inset 0 1px 0 #ffffff12,inset 0 -2px 2px #05111655;transition:transform .13s,background .14s}
.dry-choice:active:not(:disabled){transform:translateY(2px)}
.dry-choice.active{background:linear-gradient(#536f60,#40594e);border-color:#b1d0b0;color:#f3f8f0;box-shadow:inset 0 2px 5px #0004}
.dry-choice:disabled{opacity:.32}
.dry-now{display:block;position:relative;overflow:hidden;margin-top:clamp(11px,1.4vw,17px);width:100%;min-height:42px;border-radius:9px;border:1px solid #748c7966;background:linear-gradient(155deg,#385444,#2a4037);color:#e1eee3;font-size:11px;font-weight:740;box-shadow:inset 0 1px 0 #ffffff26,inset 0 -2px 0 #091a124b,0 2px 4px #0003;transition:transform .12s,background .2s}
.dry-now::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#ffffff33 50%,transparent 66%);transform:translateX(-140%);pointer-events:none}
.dry-now.fired::after{animation:dry-sheen .68s ease-out}
@keyframes dry-sheen{to{transform:translateX(140%)}}
.dry-now:active{transform:translateY(2px);box-shadow:inset 0 2px 6px #071610a8}
.paint-drop{position:fixed;z-index:100;display:block;width:12px;height:12px;border-radius:58% 43% 59% 42%;box-shadow:inset 2px 2px 3px #ffffff5c,0 2px 5px #0005;pointer-events:none;transform:translate(-50%,-50%)}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:10;max-width:calc(100vw - 28px);white-space:normal;pointer-events:none;transform:translate(-50%,8px);opacity:0;padding:11px 17px;border-radius:10px;color:#1d362b;background:#e5efdd;box-shadow:0 10px 30px #0009;font-size:12px;font-weight:700;transition:opacity .18s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-back{position:fixed;z-index:50;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#061014b8;backdrop-filter:blur(5px)}.modal-back.show{display:flex}
.modal{border-radius:17px;border:1px solid #718880;background:linear-gradient(#283b40,#1b2a31);padding:23px 24px;max-width:360px;width:100%;box-shadow:0 20px 65px #0009;animation:modal-rise .23s cubic-bezier(.15,.8,.26,1) both}
@keyframes modal-rise{from{transform:translateY(12px) scale(.976);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:17px;margin:0 0 10px}.modal p{font-size:12px;line-height:1.8;color:#bbcacc;margin:0 0 22px}.modal-buttons{display:flex;gap:9px;justify-content:flex-end}.modal-buttons .action{min-width:94px;height:40px}
/* Physical instruments: organic paint, precise hand tools, plain paper. */
.paint{--poke-x:0px;--poke-y:0px;--poke-tilt:0deg;--touch-x:50%;--touch-y:45%}
.paint.pressing .pigment-lump{transform:translate(var(--poke-x),var(--poke-y)) rotate(var(--poke-tilt)) scale(.99,.79);transition:transform .10s cubic-bezier(.2,.1,.4,1)}
.paint.pressing .pigment-stria{stroke-opacity:.32}
.paint .pigment-dent{fill:#151a16;opacity:0;mix-blend-mode:multiply;transition:opacity .12s}
.paint.pressing .pigment-dent{opacity:.19}
.paint.active .pigment-base{filter:brightness(1.06)}
.paint.pressing .pigment-well{filter:drop-shadow(0 1px 2px #020a0e91)}
.tool-bay{flex:1 1 auto;min-height:2px;display:flex;align-items:center;justify-content:center;padding:5px 0 7px;overflow:hidden;pointer-events:none}
.tool-socket{width:100%;height:min(115px,90%);max-width:268px;display:flex;align-items:center;justify-content:center;border-radius:48px;background:radial-gradient(ellipse 49% 30% at 51% 53%,#070f16c7,transparent 97%);position:relative;opacity:.85}
.tool-socket::before{content:"";position:absolute;left:8%;right:8%;top:57%;height:1px;background:linear-gradient(90deg,transparent,#c4b39124,transparent)}
.tool-socket svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 4px #0008)}
.brush-illustration{transform-origin:50% 52%;transition:transform .28s cubic-bezier(.2,1.3,.3,1)}
.brush-illustration.changed{animation:tool-settle .44s cubic-bezier(.2,.85,.2,1)}
@keyframes tool-settle{0%{transform:translateY(3px) rotate(3deg)}45%{transform:translateY(-3px) rotate(-2deg)}100%{transform:none}}
#brushHairs{transition:transform .17s cubic-bezier(.2,1,.3,1)}
#brushPaint{transition:opacity .16s,fill .18s}
.dry-module{flex-shrink:0;margin-top:auto}
.canvas-frame .dry-effect{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;z-index:2;mix-blend-mode:screen}
.panel.right .action,.panel.right .dry-choice,.panel.right .dry-now{will-change:transform}
.setting input[type=range]:focus-visible{outline:1px solid #d3e5cc;outline-offset:9px}
/* Row height is locked to the true 4:3 canvas height at desktop widths. */
@media(min-width:1001px){.panel{height:var(--canvas-height,auto)}.tool-bay{min-height:0}}
@media(min-width:1001px) and (max-width:1160px){
 .tool-bay{display:none}
 .panel.right .actions{margin-bottom:10px}
 .panel.right .mode{margin-bottom:10px}
 .panel.right .setting{margin-bottom:11px}
 .panel.right .setting-label{margin-bottom:7px}
 .panel.right .dry-head{margin-bottom:9px}
 .panel.right .dry-now{margin-top:8px;min-height:34px}
 .panel.right .dry-choice{min-height:30px;padding:4px 0}
 .panel.right .divider{margin:7px 0 11px}
}
/* Compact layouts retain full tool access; artwork, not decoration, has priority. */
@media(min-width:1001px) and (max-width:1230px){.tool-bay{min-height:1px}.tool-socket{max-height:65px;opacity:.68}}
@media(max-width:1000px){.tool-bay{min-height:20px;height:48px;flex:0 0 48px}.tool-socket{height:47px;max-width:185px}.dry-module{margin-top:0}}
@media(max-width:600px){.tool-bay{height:42px;flex-basis:42px}}
@media(min-width:1001px) and (max-width:1160px){.panel{padding:9px}.workspace{grid-template-columns:151px minmax(0,1fr) 212px;gap:10px;padding:12px}.paint{border-radius:10px}.pigment-well{height:35px}.paint .name{font-size:9px}.panel.right .actions{margin-bottom:12px}.panel.right .setting{margin-bottom:13px}.panel.right .mode{margin-bottom:14px}.dry-head{margin-bottom:10px}.divider{margin:0 0 14px}}
@media(max-width:1000px){.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:13px;padding:13px;max-width:800px}.canvas-column{grid-column:1/-1;grid-row:1}.canvas-frame{width:100%;max-width:800px}.panel.left,.panel.right{height:auto;min-height:0}.paints{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(67px,1fr));gap:7px}.pigment-well{height:45px}.paint .name{font-size:11px}.panel.right .actions{margin-bottom:17px}.panel.right .setting{margin-bottom:21px}}
@media(max-width:600px){.workspace{display:flex;flex-direction:column;gap:12px;padding:10px}.canvas-column{width:100%;order:0}.panel.left{order:1;width:100%}.panel.right{order:2;width:100%}.paints{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(74px,1fr))}.pigment-well{height:47px}.paint .name{font-size:10px}.ink-well{margin-top:6px}.actions{margin-bottom:19px}.action{height:44px}.setting{margin-bottom:19px}}

.brush-rest{display:none;min-height:0;flex:1;align-items:center;justify-content:center;pointer-events:none;opacity:.85;--brush-tone:#ffec0a}
.brush-rest-art{display:block;width:95%;height:auto;max-height:100%;filter:drop-shadow(0 4px 4px #020a1060)}
.brush-rest .rest-piece{transform-origin:50% 50%;transition:transform .26s cubic-bezier(.17,1,.32,1)}
.brush-rest[data-mode="mix"] .rest-piece{transform:rotate(-21deg) translateY(3px)}
@media (min-width:1161px) and (min-height:690px){.brush-rest{display:flex}}


/* V10 — one continuous porcelain palette, carved wells, no dark color tiles. */
.panel.left{
 color:#423f3a;
 border:1px solid #fffdf4;
 border-radius:23px;
 background:
   radial-gradient(ellipse 75% 30% at 17% 3%,#ffffff 0%,#ffffff00 90%),
   linear-gradient(116deg,#fefdf9 0%,#f4f0e9 24%,#ebe5dc 80%,#eeeae3 100%);
 box-shadow:
   inset 0 2px 3px #ffffff,
   inset 3px 0 5px #ffffffb0,
   inset -3px -3px 6px #b3aa9d4a,
   0 3px 0 #aca59c,
   0 18px 36px #050c1280,
   0 38px 58px #020a0d36;
 padding:clamp(10px,1.08vw,17px);
 gap:clamp(7px,.8vw,13px);
}
.panel.left::before{
 content:"";position:absolute;z-index:0;pointer-events:none;
 inset:4px;border:1px solid #ffffffdb;border-radius:19px;
 box-shadow:inset 0 1px 1px #ffffffb0,0 1px 1px #b4a99b38;
}
.panel.left::after{
 content:"";position:absolute;z-index:0;pointer-events:none;
 inset:7px;border-radius:16px;
 background:linear-gradient(97deg,#ffffff79 0%,transparent 8%,transparent 85%,#938c8017 99%);
}
.panel.left .paints,.panel.left .ink-well{position:relative;z-index:1}
.panel.left .paints{gap:clamp(2px,.32vw,6px)}
.panel.left .paint{
 background:transparent;border:1px solid transparent;border-radius:16px;
 box-shadow:none;overflow:visible;
 color:#504b44;
 padding:1px 0 0;gap:1px;
 transition:transform .17s cubic-bezier(.2,1,.3,1),background .18s,box-shadow .18s;
}
.panel.left .paint:hover{
 background:#ffffff45;border-color:transparent;
 box-shadow:none;
}
.panel.left .paint:active{transform:scale(.965)}
.panel.left .paint.active{
 background:transparent;border-color:transparent;
 box-shadow:none;
}
.panel.left .paint::before{display:none}
.panel.left .pigment-well::before{
 content:"";position:absolute;z-index:0;pointer-events:none;
 left:50%;top:50%;width:100%;height:100%;
 transform:translate(-50%,-50%) rotate(var(--dish-rotation,0deg));
 border-radius:50%;
 background:
   radial-gradient(ellipse 68% 48% at 46% 37%,#d4cfc6 3%,#e0d9cf 65%,transparent 100%),
   linear-gradient(145deg,#f5f1e9 8%,#e1dcd2 65%,#d4ccc0 100%);
 border:1px solid #c9c0b477;
 box-shadow:
   inset 2px 4px 7px #a69b8c7d,
   inset -2px -3px 5px #fffdf4db,
   0 -2px 0 #fffffff0,
   0 2px 2px #bbb2a57a,
   0 0 0 3px #e8e2d89c;
 transition:box-shadow .22s ease,filter .2s,transform .25s cubic-bezier(.2,1,.3,1);
}
.panel.left .paint:nth-child(3n+1){--dish-rotation:-3deg}
.panel.left .paint:nth-child(3n+2){--dish-rotation:2deg}
.panel.left .paint:nth-child(3n){--dish-rotation:-1deg}
.panel.left .paint.active .pigment-well::before{
 box-shadow:
   inset 2px 4px 7px #a69b8c7d,
   inset -2px -3px 5px #fffdf4db,
   0 -2px 0 #fffffff0,
   0 2px 2px #9b9285a3,
   0 0 0 3px #e8e2d8,
   0 0 0 5px color-mix(in srgb,var(--pigment),#f4eee4 33%),
   0 0 11px 3px color-mix(in srgb,var(--pigment),transparent 78%);
}
.panel.left .paint.active::after{display:none}
.panel.left .paint .pigment-well{
 width:clamp(54px,5.5vw,76px);
 height:clamp(54px,5.5vw,76px);
 aspect-ratio:1 / 1;
 flex:0 0 auto;
 filter:drop-shadow(0 3px 1px #55453744);
}
.panel.left .paint .pigment-art{width:90%;height:90%;margin:auto;filter:drop-shadow(0 2px 2px #5a483850)}
.panel.left .paint .name{
 color:#51493f;font-size:clamp(9px,.74vw,10.5px);font-weight:740;
 line-height:1.12;margin-top:-1px;white-space:nowrap;letter-spacing:.005em;
 text-shadow:0 1px 0 #fffafa;
}
.panel.left .paint.active .name{color:#24231f}
.panel.left .paint.pressing .pigment-well::before{filter:brightness(.973);transform:translateX(-50%) scale(.975) rotate(var(--dish-rotation,0deg))}
.panel.left .paint.pressing .pigment-well{filter:drop-shadow(0 1px 1px #51453550)}
.panel.left .ink-well{
 margin-top:auto;
 border-radius:13px;
 border:1px solid #d1c7ba;
 background:linear-gradient(165deg,#e8e2d7 0%,#f5f0e9 58%,#eeebe3 100%);
 box-shadow:inset 0 2px 6px #ada29365,inset 0 -1px 1px #fff,0 1px 0 #fff;
 padding:11px 10px 12px;
}
.panel.left .ink-head strong{color:#565149;font-size:11px}
.panel.left .ink-head span{color:#5c584f}
.panel.left .ink-bar{
 background:#c6bcae;border:1px solid #b9afa2;
 box-shadow:inset 0 2px 4px #958b7c9e,0 1px 0 #fff;
}
.panel.left .ink-fill{box-shadow:inset 0 -1px 1px #28231742,0 1px 2px #1c1d1b33}
.panel.left button:focus-visible{outline-color:#667d75}
@media (max-width:1000px){
 .panel.left{border-radius:20px}
 .panel.left .paint .pigment-well{width:50px;height:50px}
}
@media (max-width:600px){
 .panel.left{padding:13px;border-radius:19px}
 .panel.left .paints{gap:6px}
 .panel.left .paint .pigment-well{width:54px;height:54px}
 .panel.left .paint .name{font-size:10px}
}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}

/* V11 — The palette is porcelain; the brush controls live inside a sculpted walnut artist's box. */
.panel.right {
 --walnut:#3a2d24;--walnut-dark:#1e1b18;--brass:#cbb78f;--cream:#f4ead6;
 color:#eadcc9;
 border:1px solid #84674a;
 border-radius:22px;
 padding:clamp(9px,1.12vw,16px);
 background:
  radial-gradient(ellipse 110% 44% at 12% 0%,#896d4c35,transparent 81%),
  repeating-linear-gradient(94deg,transparent 0 16px,#caa77a09 16.7px,#130e0907 18px,transparent 23px,transparent 42px),
  linear-gradient(115deg,#4c392c 0%,#33281f 16%,#3b2e25 43%,#251e19 74%,#403126 100%);
 box-shadow:
   inset 0 0 0 2px #a8845c2c,
   inset 0 2px 1px #c4a47a42,
   inset -3px -3px 6px #0f0b0966,
   0 3px 0 #1d1814,
   0 19px 40px #050b0d78,
   0 35px 68px #00000022;
}
.panel.right::before {
 content:"";position:absolute;z-index:0;inset:5px;border-radius:16px;
 border:1px solid #b2906745;pointer-events:none;
 box-shadow:inset 0 1px 0 #fff2d615;
}
.panel.right::after {
 content:"";position:absolute;z-index:0;pointer-events:none;
 left:4px;right:4px;top:4px;height:30%;border-radius:17px 17px 0 0;
 background:linear-gradient(180deg,#ffffff08,transparent);
}
.panel.right > * {position:relative;z-index:1}
.panel.right .actions {
 flex:0 0 auto;gap:6px;
 padding:7px;margin-bottom:clamp(11px,1.15vw,18px);
 border-radius:14px;border:1px solid #9d80594f;
 background:linear-gradient(155deg,#211b17ee,#33271fdd);
 box-shadow:inset 0 3px 8px #0c0807bf,inset 0 -1px 1px #b4976e2b,0 1px 0 #c5a57927;
}
.panel.right .action {
 height:clamp(34px,3.1vw,45px);
 border-radius:9px;
 border:1px solid #886f4fc5;
 background:linear-gradient(165deg,#6a5745 0%,#483a2f 53%,#382d26 100%);
 color:#f0e7d6;
 font-size:clamp(10px,.83vw,12px);
 box-shadow:inset 0 1px 1px #ffe5b454,inset 0 -2px 1px #18120eaa,0 2px 3px #0007;
 text-shadow:0 1px 1px #100b0966;
 transition:transform .13s,box-shadow .13s,background .15s,filter .15s;
}
.panel.right .action svg {stroke:#ead5a8}
.panel.right .action:hover:not(:disabled){background:linear-gradient(165deg,#76614c,#514132 55%,#413229)}
.panel.right .action:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 2px 4px #130d09aa,0 1px 0 #d9b78729}
.panel.right .action:disabled {opacity:.38}
.panel.right .action.primary {
 background:linear-gradient(150deg,#fffaf0 0%,#f2e9d8 40%,#d6c6a7 100%);
 border:1px solid #fff9e5;
 color:#392c22;text-shadow:0 1px 0 #ffffffb6;
 box-shadow:inset 0 1px 0 #fff,inset 0 -2px 1px #8c77572a,0 2px 3px #0007;
}
.panel.right .action.primary svg {stroke:#66553c}
.panel.right .action.primary:hover:not(:disabled){background:linear-gradient(#fffef6,#e7d8be)}
.panel.right .mode {
 flex:0 0 auto;
 margin-bottom:clamp(9px,1.2vw,16px);
 border:1px solid #98785272;
 border-radius:13px;padding:5px;
 background:linear-gradient(150deg,#1d1816,#302720);
 box-shadow:inset 0 2px 7px #060504af,0 1px 0 #a3845e3d;
}
.panel.right .mode::before{
 top:5px;bottom:5px;left:5px;width:calc(50% - 5px);
 border-radius:9px;
 background:linear-gradient(155deg,#fffae9 0%,#eadfc9 55%,#cbbda0 100%);
 box-shadow:inset 0 1px 0 #fff,inset 0 -2px 2px #917c5d44,0 2px 6px #0007;
}
.panel.right .mode button{min-height:37px;color:#bca788;letter-spacing:.01em}
.panel.right .mode button.active{color:#483929}
.panel.right .mode .tool-icon{width:19px;height:19px}
.panel.right .calibration{
 position:relative;flex:0 0 auto;
 margin-bottom:clamp(7px,1vw,13px);
 padding:clamp(10px,.9vw,13px) clamp(9px,1vw,12px) clamp(4px,.5vw,7px);
 border:1px solid #a0835e75;border-radius:14px;
 background:
  repeating-linear-gradient(93deg,#ffffff03 0 1px,transparent 1px 19px),
  linear-gradient(155deg,#241f1a 0%,#302820 50%,#282019 100%);
 box-shadow:inset 0 3px 9px #0d0a08a8,inset 0 -1px 1px #dcc29b20,0 1px 0 #c0a17c38;
}
.panel.right .calibration::before{
 content:"";position:absolute;pointer-events:none;inset:4px;border:1px solid #a68e6930;border-radius:10px;
}
.panel.right .setting {position:relative;margin:0 0 clamp(14px,1.35vw,20px)}
.panel.right .setting:last-child{margin-bottom:7px}
.panel.right .setting-label {margin-bottom:clamp(9px,.85vw,12px)}
.panel.right .setting-label strong{color:#ead9be;font-weight:710;font-size:11px}
.panel.right .setting-label output{color:#d8bf91;letter-spacing:.02em}
.panel.right .brush-mark{border-color:#d3b47f;box-shadow:0 0 0 1px #5a4735}
.panel.right .drop-mark{background:#cfb27b}
.panel.right input[type=range]{height:7px;border-radius:6px;
 background:linear-gradient(to right,#d6ba81 0,#d6ba81 var(--pct,50%),#625142 var(--pct,50%),#625142 100%);
 border:1px solid #171410;
 box-shadow:inset 0 2px 3px #0c0908aa,0 1px 0 #c2a47a30;
}
.panel.right input[type=range]::-webkit-slider-thumb{
 appearance:none;width:22px;height:22px;border:2px solid #806844;border-radius:50%;
 background:radial-gradient(circle at 38% 29%,#fff3cd 0 10%,#e1c68c 35%,#ab8c56 74%,#79603c 100%);
 box-shadow:inset 0 0 0 2px #f4d99c52,inset 0 0 0 5px #71593725,0 2px 4px #000a,0 0 0 2px #32281e;
}
.panel.right input[type=range]::-webkit-slider-thumb:active{transform:scale(1.08)}
.panel.right input[type=range]:active::-webkit-slider-thumb{box-shadow:inset 0 0 0 2px #f4d99c52,0 2px 5px #000b,0 0 0 5px #e3c5953b}
.panel.right input[type=range]::-moz-range-thumb{
 width:18px;height:18px;border:2px solid #806844;border-radius:50%;
 background:radial-gradient(circle at 38% 29%,#fff3cd,#ab8c56 76%);
 box-shadow:0 2px 4px #000a,0 0 0 2px #32281e;
}
.panel.right .tool-bay {
 padding:3px 4px 7px;
 min-height:0;
}
.panel.right .tool-socket{
 width:100%;max-width:280px;height:min(106px,95%);
 border-radius:60px;
 background:
  radial-gradient(ellipse 55% 37% at 50% 52%,#090908b8,transparent 95%),
  linear-gradient(180deg,#3a2e25,#1b1714 53%,#49382a);
 border:1px solid #9f7d4f43;
 box-shadow:inset 0 5px 8px #130c08a3,inset 0 -2px 1px #c5a6751e,0 1px 0 #b3926738;
 opacity:1;
}
.panel.right .tool-socket::before{
 top:50%;left:6%;right:6%;height:1px;
 background:linear-gradient(90deg,transparent,#e0c59a38,transparent);
}
.panel.right .brush-cradle{
 position:absolute;left:20%;right:19%;top:60%;height:11px;border-radius:99px;
 background:linear-gradient(180deg,#07090866,#48352544,transparent);
 filter:blur(1px);
}
.panel.right .tool-socket svg{position:relative;z-index:1;filter:drop-shadow(0 5px 2px #0009)}
.panel.right .dry-module{
 flex:0 0 auto;margin-top:auto;
 padding:clamp(10px,1vw,14px) clamp(9px,.9vw,13px) clamp(10px,.85vw,12px);
 border-radius:14px;border:1px solid #a0835f78;
 background:linear-gradient(160deg,#2e261f,#211b17 55%,#33281f);
 box-shadow:inset 0 2px 8px #0907068f,inset 0 -1px 0 #ad8c6259,0 1px 0 #ac8a6333;
}
.panel.right .divider{display:none}
.panel.right .dry-head{margin-bottom:clamp(10px,.9vw,13px)}
.panel.right .dry-head strong{font-size:11px;color:#e9d8bb;gap:7px}
.panel.right .dry-head strong::before{display:none}
.panel.right .hourglass{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:#d6b881;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.5}
.panel.right .hourglass .sand-top,.panel.right .hourglass .sand-bottom{fill:#d2b77b;stroke:none;transform-box:fill-box;transform-origin:center}
.panel.right .hourglass .sand-line{stroke-dasharray:2 2;animation:sand-fall 1.1s linear infinite}
@keyframes sand-fall{to{stroke-dashoffset:-4}}
.panel.right .toggle{
 border:1px solid #98784e;background:linear-gradient(130deg,#7c8c5b,#b8c78f);
 box-shadow:inset 0 2px 4px #120f0969,0 1px 0 #dcc49c59;
}
.panel.right .toggle.off{background:linear-gradient(130deg,#41352a,#5c4733)}
.panel.right .toggle::before{
 background:radial-gradient(circle at 32% 27%,#fff8e7,#e2d1b0 70%,#9f875e);
 box-shadow:inset 0 1px 0 #fff,0 2px 3px #130e08aa;
}
.panel.right .dry-choices{gap:5px}
.panel.right .dry-choice{
 border:1px solid #745e44;border-radius:8px;
 background:linear-gradient(150deg,#5b4836,#403227);
 color:#e3d5bf;box-shadow:inset 0 1px 1px #fff1d219,inset 0 -2px 1px #15100e66,0 2px 2px #0004;
 min-height:38px;font-size:10px;
}
.panel.right .dry-choice.active{
 border-color:#e8d7b2;
 background:linear-gradient(155deg,#eee5d1,#cbbb9f);
 color:#453525;
 box-shadow:inset 0 1px 0 #fff,inset 0 -2px 1px #806d4d38,0 2px 4px #0009;
 text-shadow:0 1px 0 #fff7;
}
.panel.right .dry-choice:not(:disabled):active{transform:translateY(2px)}
.panel.right .dry-now{
 min-height:42px;margin-top:clamp(10px,1vw,15px);border-radius:10px;
 border:1px solid #b6a27f;
 background:linear-gradient(154deg,#b9b18e,#8c8d6d 58%,#6d785b);
 color:#1f251b;text-shadow:0 1px 0 #e4e2bc91;
 box-shadow:inset 0 1px 0 #f7e8c6a1,inset 0 -2px 0 #454a344d,0 2px 3px #0008;
}
.panel.right .dry-now:hover{filter:brightness(1.06)}
.panel.right .dry-now:active{box-shadow:inset 0 3px 7px #161d105d}
.panel.right .dry-now::after{background:linear-gradient(105deg,transparent 35%,#fff7d35e 50%,transparent 66%)}

 .panel.right .mode::before{inset-block:3px;left:3px;width:calc(50% - 3px)}
 .panel.right .mode button{padding:5px 0;min-height:29px;font-size:11px}

 .panel.right .dry-head{margin-bottom:7px}

 .panel.right{padding:13px;border-radius:20px}

/* Raised engraved surfaces on the four primary keys. */
.panel.right .action {position:relative;overflow:hidden;isolation:isolate;transform:translateY(0)}
.panel.right .action::before {content:"";position:absolute;pointer-events:none;inset:1px 1px auto;height:40%;border-radius:8px 8px 50% 50%;background:linear-gradient(#ffdfb427,transparent);opacity:.5;transition:opacity .14s}
.panel.right .action::after {content:"";position:absolute;pointer-events:none;inset:auto 7px 4px;height:1px;background:linear-gradient(90deg,transparent,#f4d8a34d,transparent);opacity:.5;transition:opacity .14s,transform .14s}
.panel.right .action:not(:disabled):is(:active,.mechanical-down) {transform:translateY(2.4px);filter:brightness(.91);box-shadow:inset 0 3px 6px #120a06dc,0 0 0 1px #f0d8a133}
.panel.right .action:not(:disabled):is(:active,.mechanical-down)::before{opacity:.13}
.panel.right .action:not(:disabled).mechanical-release{animation:key-return .24s cubic-bezier(.15,1.5,.32,1)}
@keyframes key-return {0%{transform:translateY(2.5px)}55%{transform:translateY(-.8px)}100%{transform:translateY(0)}}
.panel.right .mode {box-shadow:inset 0 2px 7px #050302cd,0 1px 0 #9b7a515c,0 0 0 1px #170e0a80}
.panel.right .mode::before {border:1px solid #fff9e6;box-shadow:inset 0 2px 0 #fff9ea,inset 0 -3px 1px #9c8362a0,0 4px 7px #0009;transition:transform .28s cubic-bezier(.18,1.22,.27,1)}
.panel.right .mode button:active{transform:translateY(1px) scale(.985)}
.panel.right .mode button.active .tool-icon{filter:drop-shadow(0 1px 0 #fff9)}
/* Brass inset instrument: grip ribs, engraved tick marks and inset readouts. */
.panel.right .calibration {
 background:
 radial-gradient(ellipse 75% 50% at 45% 3%,#5f493517,transparent 100%),
 repeating-linear-gradient(90deg,#97704c09 0px 1px,transparent 1px 19px),
 linear-gradient(155deg,#201a16,#2c221b 50%,#211912);
 border-color:#b18c5a8a;box-shadow:inset 0 4px 11px #080504ec,inset 0 -1px 0 #edc48a19,0 1px 0 #caac7754;
}
.panel.right .setting-label output {
 padding:3px 7px 3px;min-width:47px;text-align:right;
 border-radius:6px;border:1px solid #60482ec9;
 background:linear-gradient(#231b17,#352920);
 box-shadow:inset 0 1px 3px #0705049c,0 1px 0 #af8c5a2d;
 color:#e4c78e;font-variant-numeric:tabular-nums;
 transition:color .14s,background .14s,box-shadow .14s;
}
.panel.right .setting.manipulating .setting-label output{color:#fff2cb;background:linear-gradient(#57412b,#38291f);box-shadow:inset 0 1px 5px #0008,0 0 9px #c99b563d}
.panel.right .setting input[type=range]{position:relative;z-index:1;height:8px;outline-offset:8px;
 background:linear-gradient(to right,#e2c68e 0,#c8a46b var(--pct,50%),#70563b var(--pct,50%),#624b35 100%);box-shadow:inset 0 2px 4px #000b,0 1px 0 #ddba8442;
}
.panel.right input[type=range]::-webkit-slider-thumb {
 width:24px;height:24px;border:2px solid #a78751;
 background:
 radial-gradient(circle at 40% 35%,#fff8dc 0 9%,#e5cd95 10% 26%,#a88a58 55%,#6e5434 67%,transparent 68%),
 repeating-conic-gradient(from 4deg,#e7ce9a 0deg 11deg,#876737 11deg 16deg,#d8bb81 16deg 25deg);
 box-shadow:inset 0 0 0 1px #fff4bc66,inset 0 -1px 1px #422a11b4,0 2px 4px #000b,0 0 0 2px #211914;
 transition:box-shadow .12s,filter .12s,transform .12s cubic-bezier(.18,1.4,.3,1);
}
.panel.right input[type=range]::-moz-range-thumb {
 width:20px;height:20px;border:2px solid #a78751;
 background:radial-gradient(circle at 35% 32%,#fff4ca 0,#c8a56f 55%,#6e5434 68%,transparent 69%),repeating-conic-gradient(#e7ce9a 0 11deg,#876737 11deg 16deg,#d8bb81 16deg 25deg);
 box-shadow:inset 0 0 0 1px #fff4bc66,0 2px 4px #000b,0 0 0 2px #211914;
}
.panel.right .setting.manipulating input[type=range]::-webkit-slider-thumb{transform:scale(1.19);filter:brightness(1.09);box-shadow:inset 0 0 0 1px #fffad9a0,0 3px 9px #000d,0 0 0 5px #f1d5a32b}
.panel.right .setting.manipulating input[type=range]::-moz-range-thumb{filter:brightness(1.12);box-shadow:inset 0 0 0 1px #fffad9a0,0 3px 9px #000d,0 0 0 5px #f1d5a32b}
.panel.right .setting.settling input[type=range]::-webkit-slider-thumb{animation:brass-seat .26s cubic-bezier(.2,1.4,.35,1)}
@keyframes brass-seat {0%{transform:scale(1.18)}50%{transform:scale(.95)}100%{transform:scale(1)}}
.panel.right .rail-scale {height:6px;margin:8px 10px 0;opacity:.45;pointer-events:none;
 background:repeating-linear-gradient(90deg,#d3af784d 0px 1px,transparent 1px calc(10% - 1px),#b9956299 calc(10% - 1px) 10%);
 mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
}
/* The brush sits in a carved oval: a quick lift then settles, like a tool picked up and returned. */
.panel.right .tool-socket{background:radial-gradient(ellipse 55% 45% at 50% 50%,#0d0a08ce 0%,#1c1712 60%,#503d2b 94%,#291f18);box-shadow:inset 0 6px 12px #070503bf,inset 0 -2px 2px #e2bd8445,0 1px 0 #a58b6452}
.panel.right .tool-socket[data-tool="mix"] #brushIllustration{transform:translateY(-3px) rotate(-7deg)}
.panel.right .tool-socket[data-tool="paint"] #brushIllustration{transform:translateY(0px) rotate(0deg)}
.panel.right .brush-illustration{transition:transform .33s cubic-bezier(.2,1.3,.35,1)}
.panel.right .tool-socket.jostle svg{animation:brush-tap .4s cubic-bezier(.18,1.1,.32,1)}
@keyframes brush-tap {0%{transform:translateY(0)}35%{transform:translateY(-3px)}80%{transform:translateY(1px)}100%{transform:translateY(0)}}
/* A rocker cut into wood, with dry mode switches that click into their wells. */
.panel.right .dry-module {border-color:#a4865d82;background:linear-gradient(165deg,#30261d,#1c1713 57%,#3b2e24)}
.panel.right .toggle{border-color:#d2bb8d82;box-shadow:inset 0 2px 6px #0008,inset 0 -1px 0 #faf1cd4d,0 1px 1px #0005}
.panel.right .toggle::before{transition:transform .26s cubic-bezier(.19,1.58,.35,1)}
.panel.right .toggle:active::before{filter:brightness(1.16);box-shadow:inset 0 1px 0 #fff,0 1px 7px #040302d9}
.panel.right .dry-choice.active{transform:translateY(1px);box-shadow:inset 0 2px 6px #6e573469,0 1px 1px #0009}
.panel.right .dry-choice:not(:disabled):active{transform:translateY(3px) scale(.98)}
.panel.right .dry-now:not(:disabled):active{transform:translateY(3px) scale(.99)}

<script>

const REFERENCE_BRUSH_SIZE=28;

function gauss(w,mean,sigma){return Math.exp(-(((w-mean)/sigma)**2))}
function refl(j,w){switch(j){
 case 0:return .955; // Titanium white: strongly scattering, almost neutral
 case 1:return .028;
 case 2:return .034+.92*sigmoid((w-505)/12); // Cool lemon yellow
 case 3:return .038+.90*sigmoid((w-528)/15); // Warm deep yellow
 case 4:return .025+.88*sigmoid((w-606)/14); // Pyrrole red
 case 5:return .025+.32*gauss(w,438,42)+.87*sigmoid((w-610)/14); // Quinacridone magenta
 case 6:return .025+.78*gauss(w,438,45)+.17*gauss(w,496,45)+.10*sigmoid((w-672)/18); // Ultramarine
 case 7:return .023+.68*gauss(w,470,46)+.18*gauss(w,508,49); // Phthalo blue
 case 8:return .024+.80*gauss(w,537,40); // Phthalo green
 case 9:return .022+.45*gauss(w,418,38)+.24*gauss(w,651,49); // Dioxazine violet
 case 10:return .058+.59*sigmoid((w-541)/24); // Yellow ochre

 const w=wavelengths[b],v=.5*((w-599.8)/37.9)**2,va=.5*((w-442)/16)**2,vb=.5*((w-501.1)/20.4)**2;
 X[b]=Math.max(0,1.056*Math.exp(-v)+.362*Math.exp(-va)-.065*Math.exp(-vb));
 Y[b]=.821*Math.exp(-.5*((w-568.8)/46.9)**2)+.286*Math.exp(-.5*((w-530.9)/16.3)**2);
